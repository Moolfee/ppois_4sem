[project]
name = "lab-4-video-player-web"
version = "0.1.0"
description = "FastAPI web interface for LAB_1 video player model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = [
    "httpx>=0.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_player_web = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "../LAB_1/src"]
testpaths = ["tests"]
addopts = "--cov=video_player_web --cov-report=term-missing"
